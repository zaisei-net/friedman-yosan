<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>令和8年度予算定義・規定</title>
<style>
:root{
  --bg:#fff;--surface:#f8f9fa;--border:#e2e6ea;
  --text:#1a1d21;--text-2:#555;--text-3:#888;
  --accent:#2563eb;--accent-lt:#eff6ff;
  --green:#16a34a;--green-lt:#f0fdf4;
  --amber:#b45309;--amber-lt:#fef9e7;
  --red:#dc2626;--red-lt:#fef2f2;
  --purple:#7c3aed;--purple-lt:#ede9fe;
  --radius:6px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111;--surface:#1c1c1e;--border:#2c2c2e;
  --text:#f0f0f0;--text-2:#bbb;--text-3:#666;
  --accent:#60a5fa;--accent-lt:#1e3a5f;
  --green:#4ade80;--green-lt:#052e16;
  --amber:#fcd34d;--amber-lt:#2a1e00;
  --red:#f87171;--red-lt:#2a0000;
  --purple:#a78bfa;--purple-lt:#1e1b4b;
}}
:root[data-theme="dark"]{
  --bg:#111;--surface:#1c1c1e;--border:#2c2c2e;
  --text:#f0f0f0;--text-2:#bbb;--text-3:#666;
  --accent:#60a5fa;--accent-lt:#1e3a5f;
  --green:#4ade80;--green-lt:#052e16;
  --amber:#fcd34d;--amber-lt:#2a1e00;
  --red:#f87171;--red-lt:#2a0000;
  --purple:#a78bfa;--purple-lt:#1e1b4b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN',sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;
  display:flex;flex-direction:column;height:100vh;overflow:hidden}
button{cursor:pointer;font-family:inherit;font-size:13px;border-radius:var(--radius);
  padding:.35em .9em;border:1px solid var(--border);background:var(--surface);color:var(--text)}
button:hover{opacity:.8}
input{font-family:inherit;font-size:13px;border:1px solid var(--border);
  border-radius:var(--radius);padding:.3em .6em;background:var(--bg);color:var(--text)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}

/* Layout */
#hdr{flex-shrink:0;background:var(--bg);border-bottom:1px solid var(--border);
  padding:.45rem 1rem;display:flex;align-items:center;gap:.7rem}
#hdr h1{font-size:.95rem;font-weight:700;flex:1}
#hdr a{font-size:.82rem;color:var(--accent);text-decoration:none}
#hdr a:hover{text-decoration:underline}
#body-wrap{display:flex;flex:1;overflow:hidden}

/* Sidebar */
#sidebar{width:200px;flex-shrink:0;border-right:1px solid var(--border);
  overflow-y:auto;padding:.5rem 0;background:var(--surface)}
#sidebar button{display:block;width:100%;text-align:left;border:none;border-radius:0;
  padding:.45em 1rem;background:none;color:var(--text-2);font-size:.82rem;border-left:3px solid transparent}
#sidebar button:hover{background:var(--accent-lt);color:var(--accent)}
#sidebar button.active{background:var(--accent-lt);color:var(--accent);
  border-left-color:var(--accent);font-weight:700}

/* Main */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#search-bar{flex-shrink:0;padding:.5rem 1rem;border-bottom:1px solid var(--border)}
#search-bar input{width:100%;max-width:400px}
#ref-body{flex:1;overflow-y:auto;padding:1rem 1.5rem}

/* Content styles */
.ref-sec{margin-bottom:1.5rem}
.ref-sec h3{font-size:.82rem;font-weight:800;color:var(--accent);margin-bottom:.4rem;
  letter-spacing:.05em;text-transform:uppercase}
.ref-placeholder h3{color:var(--text-2);text-transform:none;font-size:.9rem}
.ref-placeholder .ref-text{color:var(--text-3);font-style:italic}
.ref-sec p{font-size:.83rem;line-height:1.7;white-space:pre-wrap;color:var(--text-2)}
.ref-sec mark{background:var(--amber-lt);color:var(--amber)}
.ref-text{font-size:.84rem;line-height:1.8;color:var(--text-2)}
.ref-text br{display:block;content:"";margin-top:.15rem}
.ref-tbl-wrap{overflow-x:auto;margin:.6rem 0}
.ref-tbl-wrap table{border-collapse:collapse;font-size:.78rem;width:100%;min-width:480px}
.ref-tbl-wrap th{text-align:left;padding:.3rem .6rem;background:var(--surface);
  font-weight:700;border:1px solid var(--border);white-space:nowrap;color:var(--text-3);font-size:.7rem}
.ref-tbl-wrap td{padding:.3rem .6rem;border:1px solid var(--border);vertical-align:top;line-height:1.5}
.ref-tbl-wrap td:first-child{font-weight:700;white-space:nowrap;color:var(--text)}
.ref-tbl-wrap td:nth-child(2){white-space:nowrap;color:var(--text-2)}
.ref-tbl-wrap td:nth-child(3){color:var(--text-2);font-size:.76rem}
.ref-item{padding:.25rem 0}
.ref-item+.ref-item{border-top:1px solid var(--border)}
.ref-clause{margin-bottom:.6rem;padding-bottom:.6rem;border-bottom:1px solid var(--border)}
.ref-clause:last-child{border-bottom:none}
.ref-law{background:var(--surface);border:1px solid var(--border);border-radius:3px;
  padding:.05em .35em;font-size:.8em;color:var(--text);font-weight:600}
.ref-numtbl-wrap{overflow-x:auto;margin:.6rem 0}
.ref-numtbl-wrap table{border-collapse:collapse;font-size:.78rem;width:100%}
.ref-numtbl-wrap th{padding:.3rem .6rem;background:var(--surface);font-weight:700;
  border:1px solid var(--border);color:var(--text-3);font-size:.7rem;text-align:left}
.ref-numtbl-wrap td{padding:.3rem .6rem;border:1px solid var(--border);vertical-align:top;line-height:1.5}
.ref-item-num{display:inline-flex;align-items:center;justify-content:center;
  width:1.5em;height:1.5em;border-radius:50%;background:var(--accent);color:#fff;
  font-size:.7rem;font-weight:700;margin:0 .2em .1em;vertical-align:middle}
.ref-subtbl-title{margin:1rem 0 .3rem;font-size:.8rem;font-weight:700;color:var(--text-2);letter-spacing:.03em}
.ref-amount-tbl td:last-child{text-align:right;font-variant-numeric:tabular-nums}

@media(max-width:600px){
  #sidebar{width:100%;flex-direction:row;display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border)}
  #sidebar button{white-space:nowrap;border-left:none;border-bottom:3px solid transparent}
  #sidebar button.active{border-left-color:transparent;border-bottom-color:var(--accent)}
  #body-wrap{flex-direction:column}
}
</style>
</head>
<body>
<div id="hdr">
  <h1>📖 令和8年度予算 定義・規定</h1>
  <a href="classify_review.html">← 分類レビューへ</a>
  <button onclick="document.documentElement.setAttribute('data-theme',document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')">🌓</button>
</div>
<div id="body-wrap">
  <nav id="sidebar">
    <button data-tab="sousoku" class="active" onclick="refTab('sousoku')">⒈ 予算総則</button>
    <button data-tab="kou"     onclick="refTab('kou')">⒉ 甲号</button>
    <button data-tab="otsu"    onclick="refTab('otsu')">⒊ 乙号</button>
    <button data-tab="hei"     onclick="refTab('hei')">⒋ 丙号</button>
    <button data-tab="tei"     onclick="refTab('tei')">⒌ 丁号</button>
    <button data-tab="fusoku"  onclick="refTab('fusoku')">⒍ 公債償還</button>
    <button data-tab="sainyuu" onclick="refTab('sainyuu')">⒎ 歳入明細</button>
    <button data-tab="youkyuu" onclick="refTab('youkyuu')">⒏ 経費要求</button>
    <button data-tab="sankou"  onclick="refTab('sankou')">⒐ 参考</button>
  </nav>
  <div id="main">
    <div id="search-bar">
      <input type="text" id="ref-q" placeholder="条文内検索…" oninput="refSearch(this.value)">
    </div>
    <div id="ref-body"><p style="padding:1rem;color:var(--text-3)">読み込み中…</p></div>
  </div>
</div>
<script>
let YOSAN_REF = null;

// 省庁名リスト（テーブルパース用）
const REF_MINS = ['国会','裁判所','会計検査院','内閣府','内閣','デジタル庁','防災庁',
  '総務省','法務省','外務省','財務省','文部科学省','厚生労働省',
  '農林水産省','経済産業省','国土交通省','環境省','防衛省'];

function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function applyQ(s, q){
  if(!q) return s;
  const esc = q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return s.replace(new RegExp(esc,'gi'), m=>`<mark>${m}</mark>`);
}
function fmtLaw(s){ return s.replace(/｢([^｣]+?)｣/g, (_, t)=>`<span class="ref-law">「${t}」</span>`); }

function splitTopLevel(text) {
  // 括弧内の読点を無視してトップレベルの「、」で分割
  const result = []; let depth = 0, start = 0;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c==='('||c==='（') depth++;
    else if (c===')'||c==='）') depth--;
    else if ((c==='、'||c===',') && depth===0) {
      const s = text.slice(start,i).trim(); if(s) result.push(s);
      start = i+1;
    }
  }
  const s = text.slice(start).trim(); if(s) result.push(s);
  return result;
}

function _parseMinistryRows(text) {
  const tokens = text.trim().split(/\s+/);
  const minSet = new Set(REF_MINS);
  const ORG_PAT = /[省庁院局所館委員会部課署関府房]$/;
  const rows = []; let cur = null, buf = [];
  for (const t of tokens) {
    if (minSet.has(t)) {
      if (cur && !cur.org && !buf.length) { cur.org = t; }
      else { if (cur) { cur.items.push(buf.splice(0).join(' ')); rows.push(cur); } cur = {ministry:t,org:'',items:[]}; }
    } else if (cur && t.length<=20 && ORG_PAT.test(t) && !t.endsWith('費') && !t.endsWith('金') && !t.endsWith('金。')) {
      if (!cur.org && !buf.length) { cur.org = t; }
      else if (cur.org) { cur.items.push(buf.splice(0).join(' ')); rows.push(cur); cur = {ministry:cur.ministry,org:t,items:[]}; }
      else { buf.push(t); }
    } else if (cur) { buf.push(t); }
  }
  if (cur) { cur.items.push(buf.join(' ')); rows.push(cur); }
  return rows;
}

function _renderMinistryTbl(rows, headers, q) {
  let tbl = `<div class="ref-tbl-wrap"><table><thead><tr>${headers.map(h=>`<th>${escHtml(h)}</th>`).join('')}</tr></thead><tbody>`;
  for (const r of rows) {
    const items = splitTopLevel(normalizeText(r.items.join(' '))).filter(Boolean);
    const itemHtml = items.map(s=>`<div class="ref-item">${applyQ(fmtLaw(escHtml(normalizeText(s))),q)}</div>`).join('');
    tbl += `<tr><td>${applyQ(escHtml(normalizeText(r.ministry)),q)}</td><td>${applyQ(escHtml(normalizeText(r.org)),q)}</td><td>${itemHtml}</td></tr>`;
  }
  return tbl + '</tbody></table></div>';
}

function parseMinistryTable(text, q) {
  const rows = _parseMinistryRows(text);
  if (!rows.length) return null;
  return _renderMinistryTbl(rows, ['所管','組織','項'], q);
}

// 第6条: 公債発行限度額
function parseKosaiTable(rawText, q) {
  const m1 = rawText.match(/第\s*4\s*条第\s*1\s*項.*?([\d,]+)\s*千円とする/s);
  const m2 = rawText.match(/財政運営に必要な財源.*?([\d,]+)\s*千円とする/s);
  let html = '<div class="ref-tbl-wrap ref-amount-tbl"><table><thead><tr><th>区分</th><th>限度額（千円）</th></tr></thead><tbody>';
  if (m1) html += `<tr><td>建設公債（財政法第4条）</td><td>${escHtml(m1[1])}</td></tr>`;
  if (m2) html += `<tr><td>特例公債（特例法）</td><td>${escHtml(m2[1])}</td></tr>`;
  html += '</tbody></table></div>';
  return html + fmtProse(normalizeText(rawText), q);
}

// 第16条: 予算の移用 (第1表〜第3表)
function parseIyoTable(rawText, q) {
  const markers = [];
  const re = /第\s*(\d)\s*表　/g; let m;
  while ((m = re.exec(rawText)) !== null) markers.push({n:+m[1], idx:m.index});
  if (!markers.length) return fmtProse(normalizeText(rawText), q);
  markers[markers.length-1].end = rawText.length;
  for (let i=0;i<markers.length-1;i++) markers[i].end = markers[i+1].idx;
  const preamble = rawText.slice(0, markers[0].idx);
  let html = preamble.trim() ? fmtProse(normalizeText(preamble), q) : '';
  for (const s of markers) {
    const chunk = rawText.slice(s.idx, s.end);
    if (s.n===1) html += renderIyo1(chunk, q);
    else if (s.n===2) html += renderIyo2(chunk, q);
    else html += renderIyo3(chunk, q);
  }
  return html;
}

function _stripRowNums(text) {
  const minPat = '(?:' + REF_MINS.join('|') + ')';
  return text.trim().replace(new RegExp(`\\s*\\d+\\s+(?=${minPat})`, 'g'), ' ');
}

function renderIyo1(text, q) {
  const hEnd = text.indexOf('）') >= 0 ? text.indexOf('）') + 1 :
               text.indexOf('｡)') >= 0 ? text.indexOf('｡)') + 2 : -1;
  const body = hEnd >= 0 ? text.slice(hEnd) : text.replace(/第\s*1\s*表\S*/, '');
  const stripped = _stripRowNums(body);
  const minSet = new Set(REF_MINS);
  const tokens = stripped.split(/\s+/);
  const rows = []; let cur = null, buf = [];
  for (const t of tokens) {
    if (minSet.has(t)) { if (cur) rows.push({ministry:cur, content:buf.join(' ')}); cur=t; buf=[]; }
    else if (cur) buf.push(t);
  }
  if (cur) rows.push({ministry:cur, content:buf.join(' ')});
  if (!rows.length) return fmtProse(normalizeText(text), q);
  let tbl = '<h4 class="ref-subtbl-title">第1表　各組織の間の移用</h4><div class="ref-tbl-wrap"><table><thead><tr><th>所管</th><th>移用することができる組織</th></tr></thead><tbody>';
  for (const r of rows) {
    tbl += `<tr><td style="vertical-align:top;white-space:nowrap">${applyQ(escHtml(normalizeText(r.ministry)),q)}</td><td>${applyQ(fmtLaw(escHtml(normalizeText(r.content))),q)}</td></tr>`;
  }
  return tbl + '</tbody></table></div>';
}

function renderIyo2(text, q) {
  const hdr = '移用することができる項';
  const hdrIdx = text.indexOf(hdr);
  const body = hdrIdx >= 0 ? text.slice(hdrIdx + hdr.length) : text;
  const rows = _parseMinistryRows(_stripRowNums(body));
  if (!rows.length) return fmtProse(normalizeText(text), q);
  return '<h4 class="ref-subtbl-title">第2表　各項の間の移用</h4>' + _renderMinistryTbl(rows, ['所管','組織','移用することができる項'], q);
}

function renderIyo3(text, q) {
  const body = text.replace(/第\s*3\s*表　[^\d]*/, '');
  return '<h4 class="ref-subtbl-title">第3表　各組織の間又は各項の間の移用</h4>' + fmtProse(normalizeText(body), q);
}

// 主管 部 款 項 形式（第10条 歳入表など）
function parseShukanTable(text, q) {
  const tokens = text.trim().split(/\s+/);
  const minSet = new Set(REF_MINS);
  const rows = [];
  let cur = null, buf = [], phase = 0; // phase: 0=items, 1=expect-bu, 2=expect-kan
  for (const t of tokens) {
    if (minSet.has(t)) {
      if (cur) { cur.items.push(buf.join(' ')); rows.push(cur); buf = []; }
      cur = { ministry: t, bu: '', kan: '', items: [] };
      phase = 1;
    } else if (cur && phase === 1) { cur.bu = t; phase = 2; }
    else if (cur && phase === 2) { cur.kan = t; phase = 0; }
    else if (cur) { buf.push(t); }
  }
  if (cur) { cur.items.push(buf.join(' ')); rows.push(cur); }
  if (rows.length === 0) return null;
  let tbl = '<div class="ref-tbl-wrap"><table><thead><tr><th>主管</th><th>部</th><th>款</th><th>項</th></tr></thead><tbody>';
  for (const r of rows) {
    const items = r.items.join(' ').split(/[、,]/).map(s=>normalizeText(s.trim())).filter(Boolean);
    const itemHtml = items.map(s=>applyQ(fmtLaw(escHtml(s)), q)).join('<br>');
    tbl += `<tr><td>${applyQ(escHtml(r.ministry),q)}</td><td>${applyQ(escHtml(normalizeText(r.bu)),q)}</td><td>${applyQ(escHtml(normalizeText(r.kan)),q)}</td><td>${itemHtml}</td></tr>`;
  }
  tbl += '</tbody></table></div>';
  return tbl;
}

function normalizeText(text) {
  const JP = '[一-龯ぁ-ヾ々]';
  const jpjp = new RegExp('(' + JP + ') +(' + JP + ')', 'g');
  const jpn  = new RegExp('(' + JP + ') +(\\d)', 'g');
  const njp  = new RegExp('(\\d) +(' + JP + ')', 'g');
  let t = text;
  for (let i = 0; i < 5; i++) t = t.replace(jpjp, '$1$2');
  return t
    .replace(jpn,  '$1$2')
    .replace(njp,  '$1$2')
    .replace(/([)）]) +([一-龯ぁ-ヾ々])/g,  '$1$2')
    .replace(/｣ +([一-龯ぁ-ヾ々])/g,        '｣$1')
    .replace(/([一-龯ぁ-ヾ々\d]) +｢/g,      '$1｢')
    .replace(/、 +([一-龯ぁ-ヾ々（(])/g,    '、$1')
    .replace(/。 +([一-龯ぁ-ヾ々])/g,       '。$1')
    .replace(/｡ +([一-龯ぁ-ヾ々（(｢])/g,   '｡$1')
    .replace(/(\d) +([,、])/g,              '$1$2')
    .replace(/([,、]) +(\d)/g,              '$1$2');
}

function fmtProse(text, q) {
  const s = escHtml(normalizeText(text))
    .replace(/｢([^｣]+?)｣/g, (_, t) => `<span class="ref-law">「${t}」</span>`)
    .replace(/第\s*(\d+)\s*条/g, '<strong>第$1条</strong>')
    .replace(/第\s*(\d+)\s*表/g, '<br><strong>第$1表</strong>')
    .replace(/。\s*(\d{1,2})\s+(?=[^\d０-９])/g,
      (_, n) => `。<br><span class="ref-item-num">${n}</span>&ensp;`)
    .replace(/。(?!<)/g, '。<br>');
  return `<div class="ref-clause ref-text">${applyQ(s, q)}</div>`;
}

function parseLimitTable(text, q) {
  const sep = '区分 限度額(千円)';
  const idx = text.indexOf(sep);
  const prose = idx > 0 ? text.slice(0, idx) : '';
  const tableText = idx >= 0 ? text.slice(idx + sep.length) : text;
  const tokens = tableText.trim().split(/\s+/);
  const rows = [];
  let cur = [];
  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i];
    const isNum = /^[\d,]+$/.test(t);
    cur.push(t);
    if (isNum && (i + 1 >= tokens.length || !/^[\d,]+$/.test(tokens[i+1]))) {
      rows.push([...cur]); cur = [];
    }
  }
  if (cur.length) rows.push(cur);
  let tbl = '<div class="ref-tbl-wrap"><table><thead><tr><th>区分</th><th style="text-align:right">限度額（千円）</th></tr></thead><tbody>';
  for (const row of rows) {
    if (!row.length) continue;
    const lastNum = row.reduce((li, t, i) => /^[\d,]+$/.test(t) ? i : li, -1);
    if (lastNum < 0) {
      tbl += `<tr><td colspan="2">${applyQ(fmtLaw(escHtml(row.join(' '))), q)}</td></tr>`;
    } else {
      const desc = applyQ(fmtLaw(escHtml(row.slice(0, lastNum).join(' '))), q);
      const amt  = escHtml(row[lastNum]);
      tbl += `<tr><td>${desc}</td><td style="text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap">${amt}</td></tr>`;
    }
  }
  tbl += '</tbody></table></div>';
  return (prose.trim() ? fmtProse(prose, q) : '') + tbl;
}

function parseDebtTable(text, q) {
  const sep = '債務 根拠規定 金額の限度';
  const idx = text.indexOf(sep);
  const prose = idx > 0 ? text.slice(0, idx) : '';
  const tableText = idx >= 0 ? text.slice(idx + sep.length) : text;
  const rowTexts = tableText.trim().split(/(?=\s\d+\s+[^\d\s])/);
  let tbl = '<div class="ref-numtbl-wrap"><table><thead><tr><th>#</th><th>債務 ／ 根拠規定 ／ 金額</th></tr></thead><tbody>';
  for (const rt of rowTexts) {
    const m = rt.trim().match(/^(\d+)\s+(.+)/s);
    if (!m) continue;
    const content = applyQ(
      fmtLaw(escHtml(m[2].trim()))
        .replace(/。\s*(\d{1,2})\s+(?=[^\d０-９])/g,
          (_, n) => `。<br><span class="ref-item-num">${n}</span>&ensp;`)
        .replace(/。(?!<)/g, '。<br>'),
      q
    );
    tbl += `<tr><td style="font-weight:700;white-space:nowrap;vertical-align:top">${escHtml(m[1])}</td><td>${content}</td></tr>`;
  }
  tbl += '</tbody></table></div>';
  return (prose.trim() ? fmtProse(prose, q) : '') + tbl;
}

function formatContent(text, q) {
  const rawText = text;
  text = normalizeText(text);
  if (rawText.includes('所管 組織 項')) {
    const rawParts = rawText.split('所管 組織 項');
    const parts    = text.split('所管組織項');
    let html = parts[0] && parts[0].trim() ? fmtProse(parts[0], q) : '';
    for (let i = 1; i < rawParts.length; i++) {
      const tblHtml = parseMinistryTable(rawParts[i], q);
      html += tblHtml || `<div class="ref-text">${applyQ(fmtLaw(escHtml(parts[i] || '')), q)}</div>`;
    }
    return html;
  }
  if (rawText.includes('主管 部 款 項')) {
    const rawParts = rawText.split('主管 部 款 項');
    const parts    = text.split('主管部款項');
    let html = parts[0] && parts[0].trim() ? fmtProse(parts[0], q) : '';
    for (let i = 1; i < rawParts.length; i++) {
      const tblHtml = parseShukanTable(rawParts[i], q);
      html += tblHtml || `<div class="ref-text">${applyQ(fmtLaw(escHtml(parts[i] || '')), q)}</div>`;
    }
    return html;
  }
  if (rawText.includes('区分 限度額')) return parseLimitTable(rawText, q);
  if (rawText.includes('債務 根拠規定')) return parseDebtTable(rawText, q);
  if (rawText.includes('財政法｣第 4 条第 1 項ただし書')) return parseKosaiTable(rawText, q);
  if (rawText.includes('第 1 表　')) return parseIyoTable(rawText, q);
  return fmtProse(text, q);
}

function _refPlaceholder(title, desc){
  return `<div class="ref-sec ref-placeholder"><h3>${escHtml(title)}</h3><p class="ref-text">${escHtml(desc)}</p></div>`;
}

function refTab(key){
  document.querySelectorAll('#sidebar button').forEach(b=>b.classList.remove('active'));
  const btn = document.querySelector(`#sidebar button[data-tab="${key}"]`);
  if(btn) btn.classList.add('active');
  if(!YOSAN_REF){document.getElementById('ref-body').innerHTML='<p style="padding:1rem;color:var(--text-3)">読み込み中…</p>';return;}
  renderRefBody(key, document.getElementById('ref-q').value);
}
function refSearch(q){
  const activeTab = document.querySelector('#sidebar button.active');
  const key = activeTab ? activeTab.dataset.tab : 'sousoku';
  if(!YOSAN_REF) return;
  renderRefBody(key, q);
}

function renderRefBody(key, q){
  const body = document.getElementById('ref-body');
  let html = '';
  if(key === 'sankou'){
    const cs = YOSAN_REF.code_system;
    const ex = applyQ(escHtml(cs.example||''), q);
    html += `<div class="ref-sec"><h3>コード番号について（コード体系 11桁）</h3>`;
    html += `<p class="ref-text">${applyQ(escHtml(cs.description||''),q)}</p>`;
    if(ex) html += `<p class="ref-text" style="margin-top:.4rem;font-family:monospace">${ex}</p>`;
    html += `<h3 style="margin-top:.8rem">使途別コード</h3>`;
    html += '<div class="ref-tbl-wrap"><table><thead><tr><th>コード</th><th>名称</th></tr></thead><tbody>';
    for(const [k,v] of Object.entries(cs.shiyo_betsu||{}))
      html += `<tr><td>${escHtml(k)}</td><td>${applyQ(escHtml(v),q)}</td></tr>`;
    html += '</tbody></table></div>';
    html += `<h3 style="margin-top:.8rem">目別コード</h3>`;
    html += '<div class="ref-tbl-wrap"><table><thead><tr><th>コード</th><th>名称</th></tr></thead><tbody>';
    for(const [k,v] of Object.entries(cs.moku_betsu||{}))
      html += `<tr><td>${escHtml(k)}</td><td>${applyQ(escHtml(v),q)}</td></tr>`;
    html += '</tbody></table></div>';
    html += `<h3 style="margin-top:.8rem">予算書情報について</h3>`;
    html += `<p class="ref-text">令和8年度一般会計予算のXMLデータは財務省 bb.mof.go.jp より取得。全236ファイル(Shift-JIS)をUTF-8変換して yosan_ref.json / xml_full.json に格納。予算総則テキストは16セクションに分割して本ページで参照可能。歳出6,777目は各省各庁予定経費要求書等から抽出して classify_review.html に収録。</p>`;
    html += '</div>';
  } else if(key === 'sousoku'){
    const secs = YOSAN_REF.yosan_sousoku.filter(s=>
      !q || s.title.includes(q) || s.content.includes(q)
    );
    if(secs.length === 0){
      html = '<p style="padding:1rem;color:var(--text-3)">該当なし</p>';
    } else {
      for(const s of secs){
        const titleHtml = applyQ(escHtml(s.title), q);
        html += `<div class="ref-sec"><h3>${titleHtml}</h3>${formatContent(s.content, q)}</div>`;
      }
    }
  } else {
    const PLACEHOLDERS = {
      'kou':    ['甲号 歳入歳出予算', '令和8年度一般会計の歳入・歳出予算額を款・項・目別に記載した予算書。歳出6,777目のデータはこの甲号から抽出し、classify_review.html に収録しています。'],
      'otsu':   ['乙号 継続費', '複数年度にわたって支出が予定される継続費の総額・年割額を記載。工事・製造その他の事業に関する経費で、財政法第14条の2に基づく。'],
      'hei':    ['丙号 繰越明許費', '歳出予算のうち、年度内に支出が終わらない見込みがある経費について翌年度への繰越を予め承認するもの（財政法第14条の3）。'],
      'tei':    ['丁号 国庫債務負担行為', '法律に基づかず、国が将来の年度において債務を負担する行為を予算で定めたもの（財政法第15条）。限度額・年度を記載。'],
      'fusoku': ['(添付) 公債の償還計画表', '財政法第4条第3項及び特例公債法に基づき令和8年度に発行を予定する公債の償還計画表。建設公債・特例公債それぞれの発行額・償還額・残高を記載。'],
      'sainyuu':['令和8年度一般会計歳入予算明細書', '歳入の款・項・目別に収入の根拠・見積もり説明を記載した参照書。各収入科目の積算根拠が確認できる。'],
      'youkyuu':['令和8年度一般会計各省各庁予定経費要求書等', '各省各庁が要求した歳出予算の説明書（積算根拠・事業説明）。本レビューツールの6,777目はこの要求書等の構造に対応。'],
    };
    const ph = PLACEHOLDERS[key];
    if(ph) html = _refPlaceholder(ph[0], ph[1]);
    else    html = '<p style="padding:1rem;color:var(--text-3)">不明なタブ</p>';
  }
  body.innerHTML = html;
}

fetch('yosan_ref.json')
  .then(r=>r.json())
  .then(data=>{
    YOSAN_REF=data;
    refTab('sousoku');
  })
  .catch(e=>{
    document.getElementById('ref-body').innerHTML=
      `<p style="padding:1rem;color:var(--red)">データ読み込み失敗: ${escHtml(String(e))}<br>ローカルで開く場合はサーバー経由でアクセスしてください。</p>`;
  });
</script>
</body>
</html>
