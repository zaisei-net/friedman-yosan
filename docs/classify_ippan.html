<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フリードマン予算分類</title>
<meta name="description" content="令和8年度一般会計歳出をフリードマンの政府役割10分類に照らして評価し、財政規模半減の根拠を示す。">
<style>
:root {
  --bg: #ffffff;
  --bg-2: #f5f7fa;
  --bg-3: #edf0f6;
  --border: #dde2ec;
  --border-strong: #c5cdd9;
  --text: #0d1624;
  --text-2: #3d4f66;
  --text-3: #7a8fa8;
  --blue: #1a56db;
  --blue-light: #eef3fe;
  --blue-mid: #3b7ff5;
  --red: #c41e3a;
  --red-light: #fdf1f3;
  --green: #156d3c;
  --green-light: #eaf6ee;
  --orange: #c2620a;
  --topbar-bg: #ffffff;
  --topbar-border: #dde2ec;
  --topbar-text: #3d4f66;
  --topbar-active: #1a56db;
  --hero-bg: #ffffff;
}
:root[data-theme="dark"] {
  --bg: #121212;
  --bg-2: #1e1e1e;
  --bg-3: #272727;
  --border: rgba(255,255,255,.10);
  --border-strong: rgba(255,255,255,.18);
  --text: rgba(255,255,255,.87);
  --text-2: rgba(255,255,255,.60);
  --text-3: rgba(255,255,255,.38);
  --blue: #82b1ff;
  --blue-light: #0d1e42;
  --blue-mid: #6b96f5;
  --red: #ff8a80;
  --red-light: #2a0a12;
  --green: #a5d6a7;
  --green-light: #071a0c;
  --orange: #ffcc80;
  --topbar-bg: #1e1e1e;
  --topbar-border: rgba(255,255,255,.08);
  --topbar-text: rgba(255,255,255,.60);
  --topbar-active: #82b1ff;
  --hero-bg: #1e1e1e;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,"BIZ UDGothic",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.75;font-size:14px;
}
a{color:inherit;text-decoration:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── Topbar ── */
.topbar{
  border-bottom:1px solid var(--topbar-border);
  padding:.55rem 2rem;
  display:flex;align-items:center;gap:1.5rem;
  position:sticky;top:0;background:var(--topbar-bg);z-index:200;
}
.topbar-logo{
  font-size:.78rem;font-weight:700;letter-spacing:.18em;
  color:var(--text);white-space:nowrap;
}
.topbar-logo em{font-style:normal;color:var(--blue)}
.topbar-spacer{flex:1}
.theme-btn{
  font-size:.72rem;padding:.25rem .7rem;
  border:1px solid var(--border-strong);border-radius:4px;
  background:transparent;color:var(--text-2);cursor:pointer;white-space:nowrap;
}
.theme-btn:hover{border-color:var(--blue);color:var(--blue)}

/* ── Hero ── */
.hero{
  background:var(--hero-bg);
  padding:4rem 2rem 3.5rem;
  border-bottom:1px solid var(--border);
  position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--blue) 0%,#0d47a1 100%);
}
.hero::after{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(var(--border) 1px,transparent 1px),
    linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:48px 48px;opacity:.35;pointer-events:none;
}
.hero-inner{max-width:960px;margin:0 auto;position:relative;z-index:1}
.hero-label{
  display:inline-flex;align-items:center;gap:.6rem;
  font-size:.62rem;font-weight:800;letter-spacing:.28em;
  color:var(--blue);text-transform:uppercase;margin-bottom:1.5rem;
}
.hero-label-dot{
  width:6px;height:6px;border-radius:50%;background:var(--blue);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hero h1{
  font-size:clamp(1.6rem,4vw,2.8rem);font-weight:900;line-height:1.1;
  letter-spacing:-.025em;color:var(--text);margin-bottom:1rem;text-wrap:balance;
}
.hero h1 .accent{color:var(--blue)}
.hero-sub{
  font-size:.9rem;color:var(--text-2);max-width:56ch;
  line-height:1.8;margin-bottom:2rem;
  border-left:3px solid var(--blue);padding-left:1.1rem;
}

/* ── KPI strip ── */
.kpi-strip{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
  background:var(--border);border:1px solid var(--border);border-radius:8px;
  overflow:hidden;margin-top:2rem;max-width:640px;
}
.kpi{
  background:var(--bg);padding:1.4rem 1.5rem;
  display:flex;flex-direction:column;gap:.3rem;
}
.kpi-label{font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.kpi-val{
  font-size:1.7rem;font-weight:900;letter-spacing:-.04em;
  line-height:1;font-variant-numeric:tabular-nums;
}
.kpi-val.blue{color:var(--blue)}
.kpi-val.red{color:var(--red)}
.kpi-val.green{color:var(--green)}
.kpi-note{font-size:.68rem;color:var(--text-3)}

/* ── Outer wrapper ── */
.outer{max-width:960px;margin:0 auto;padding:0 2rem}

/* ── Section header ── */
.sh{display:flex;align-items:center;gap:.9rem;margin-bottom:1.4rem}
.sh-tag{font-size:.6rem;font-weight:900;letter-spacing:.22em;color:var(--text-3);white-space:nowrap;text-transform:uppercase}
.sh-rule{flex:1;height:1px;background:var(--border)}

/* ── Bars section ── */
.bars-section{padding:3.5rem 0}
.bars-card{
  background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:1.4rem 1.6rem;overflow-x:auto;
}
.bar-row{display:flex;align-items:center;gap:.75rem;margin-bottom:.5rem}
.bar-row:last-child{margin-bottom:0}
.bar-kan{
  font-size:.72rem;width:90px;flex-shrink:0;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--text-2);cursor:pointer;transition:color .1s;
}
.bar-kan:hover{color:var(--blue)}
.bar-track{
  flex:1;display:flex;height:18px;border-radius:3px;
  overflow:hidden;min-width:0;cursor:pointer;
}
.bar-seg{height:100%;transition:opacity .12s}
.bar-seg:hover{opacity:.75}
.bar-total{
  font-size:.65rem;color:var(--text-3);width:60px;flex-shrink:0;
  font-variant-numeric:tabular-nums;text-align:right;
}

/* ── Legend ── */
.legend-section{
  background:var(--bg-2);border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  padding:2.5rem 2rem;
}
.legend-inner{max-width:960px;margin:0 auto}
.legend-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));
  gap:.3rem;margin-top:.5rem;
}
.leg-item{
  display:flex;align-items:center;gap:.6rem;
  font-size:.73rem;color:var(--text-2);line-height:1.5;
  cursor:pointer;padding:.28rem .3rem;border-radius:4px;transition:background .1s;
  overflow:hidden;
}
.leg-item:hover{background:var(--bg-3);color:var(--text)}
.leg-item span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}

/* ── Table section ── */
.table-section{padding:3rem 0 4rem}
.filters{
  display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:.9rem;align-items:center;
}
.filters select,.filters input[type=text]{
  background:var(--bg);border:1px solid var(--border);border-radius:5px;
  color:var(--text);padding:.32rem .65rem;font-size:.75rem;
  font-family:inherit;transition:border-color .1s;max-width:100%;
}
.filters select:focus,.filters input:focus{outline:none;border-color:var(--blue)}
.cnt-lbl{font-size:.75rem;color:var(--text-3);margin-left:.2rem}
.tbl-wrap{
  border:1px solid var(--border);border-radius:8px;overflow:hidden;overflow-x:auto;
  background:var(--bg);-webkit-overflow-scrolling:touch;
}
table{width:100%;border-collapse:collapse;font-size:.77rem}
thead th{
  background:var(--bg-2);padding:.52rem .8rem;text-align:left;
  font-weight:700;font-size:.63rem;text-transform:uppercase;
  letter-spacing:.07em;color:var(--text-3);white-space:nowrap;
  border-bottom:1px solid var(--border);
}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--bg-2)}
td{padding:.42rem .8rem;border-bottom:1px solid var(--border);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
.mono{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.chip{
  display:inline-flex;align-items:center;gap:.22rem;
  padding:.12rem .45rem;border-radius:4px;font-size:.67rem;font-weight:700;
  white-space:nowrap;margin-right:2px;
}
.td-reason{font-size:.68rem;color:var(--text-2);min-width:180px;line-height:1.55}
/* モバイルで理由列・項名列を非表示 */
.col-ko,.col-reason{display:table-cell}

/* ── Pager ── */
.pager{display:flex;align-items:center;gap:.5rem;margin-top:.8rem;font-size:.75rem;color:var(--text-3);flex-wrap:wrap}
.pager button{
  background:var(--bg);border:1px solid var(--border);border-radius:5px;
  color:var(--text-2);padding:.26rem .65rem;cursor:pointer;font-size:.75rem;
  transition:border-color .1s,color .1s;
}
.pager button:hover{border-color:var(--blue);color:var(--blue)}
.pager button:disabled{opacity:.35;cursor:default}

/* ── Tooltip ── */
.tooltip{
  position:fixed;background:var(--bg);border:1px solid var(--border-strong);
  border-radius:6px;padding:.5rem .85rem;font-size:.73rem;
  pointer-events:none;opacity:0;transition:opacity .12s;
  z-index:999;line-height:1.85;white-space:nowrap;
  box-shadow:0 4px 20px rgba(0,0,0,.12);
}

/* ── Footer ── */
.footer{
  border-top:1px solid var(--border);padding:2rem 2rem;
  font-size:.72rem;color:var(--text-3);text-align:center;
}

/* ── Responsive ── */
@media(max-width:768px){
  .topbar{padding:.5rem 1rem;gap:1rem}
  .hero{padding:3rem 1rem 2.5rem}
  .outer{padding:0 1rem}
  .kpi-strip{grid-template-columns:1fr;max-width:100%}
  .bars-section{padding:2.5rem 0}
  .bars-card{padding:1rem}
  .bar-kan{width:70px;font-size:.68rem}
  .bar-total{width:52px;font-size:.62rem}
  .legend-section{padding:2rem 1rem}
  .legend-grid{grid-template-columns:1fr}
  .table-section{padding:2rem 0 3rem}
  .filters input[type=text]{width:100%}
}
@media(max-width:480px){
  .topbar-logo{font-size:.72rem;letter-spacing:.1em}
  .hero h1{font-size:1.5rem}
  .hero-sub{font-size:.82rem}
  .bar-kan{width:60px;font-size:.65rem}
  .bar-total{display:none}
  /* 狭い画面では項名・理由を非表示 */
  .col-ko,.col-reason{display:none}
  thead th.col-ko,thead th.col-reason{display:none}
}
</style>
</head>
<body>

<nav class="topbar">
  <span class="topbar-logo">財政規模半減<em>構想</em></span>
  <div class="topbar-spacer"></div>
  <button class="theme-btn" onclick="toggleTheme()">ダーク切替</button>
</nav>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-label">
      <span class="hero-label-dot"></span>
      令和8年度 一般会計 · フリードマン分類
    </div>
    <h1>一般会計歳出<br><span class="accent">3,409科目</span>を分類する</h1>
    <p class="hero-sub">
      フリードマンが示した政府の10の正当な役割に照らし、各歳出項目の存在根拠を評価。<br>
      市場の失敗を実証できない経費を洗い出し、<strong>財政規模の半減</strong>を試算する。
    </p>
    <div class="kpi-strip" id="kpi-strip"></div>
  </div>
</section>

<main>
  <section class="bars-section">
    <div class="outer">
      <div class="sh">
        <span class="sh-tag">所管別内訳</span>
        <span class="sh-rule"></span>
      </div>
      <div class="bars-card">
        <div id="bars"></div>
      </div>
    </div>
  </section>

  <section class="legend-section">
    <div class="legend-inner">
      <div class="sh">
        <span class="sh-tag">フリードマン10分類</span>
        <span class="sh-rule"></span>
      </div>
      <div class="legend-grid" id="legend"></div>
    </div>
  </section>

  <section class="table-section">
    <div class="outer">
      <div class="sh">
        <span class="sh-tag">科目一覧</span>
        <span class="sh-rule"></span>
        <span class="cnt-lbl" id="cnt-lbl"></span>
      </div>
      <div class="filters">
        <select id="fKan"><option value="">所管: 全て</option></select>
        <select id="fCls"><option value="">分類: 全て</option></select>
        <input type="text" id="fTxt" placeholder="科目名で検索…" style="width:210px">
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th>所管</th><th class="col-ko">項名</th><th>目名</th>
            <th style="text-align:right">元額(億円)</th>
            <th>分類</th>
            <th style="text-align:right">残す額(億円)</th>
            <th class="col-reason">判定理由</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="pager">
        <button id="pPrev">‹ 前</button>
        <span id="pInfo"></span>
        <button id="pNext">次 ›</button>
        <span id="pTot"></span>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  フリードマン予算構想 · zaisei-net · データ出典: 令和8年度一般会計歳出予算
</footer>

// KPI
const totA=data.rows.reduce((s,r)=>s+r.a,0);
const totS=data.rows.reduce((s,r)=>s+r.s,0);
const delPct=((1-totS/totA)*100).toFixed(1);
[
  {label:'現行歳出',val:Math.round(totA).toLocaleString(),unit:'億円',
   note:'GDP比 '+(totA/60000000*100).toFixed(1)+'%（600兆円換算）',cls:'blue'},
  {label:'改革後歳出',val:Math.round(totS).toLocaleString(),unit:'億円',
   note:'GDP比 '+(totS/60000000*100).toFixed(1)+'%',cls:'green'},
  {label:'削減額',val:Math.round(totA-totS).toLocaleString(),unit:'億円',
   note:delPct+'% 削減',cls:'red'},
].forEach(c=>{
  const d=document.createElement('div');d.className='kpi';
  d.innerHTML='<div class="kpi-label">'+c.label+'</div>'
    +'<div class="kpi-val '+c.cls+'">'+c.val
    +'<span style="font-size:.9rem;font-weight:600;margin-left:.2rem;color:var(--text-3)">'+c.unit+'</span></div>'
    +'<div class="kpi-note">'+c.note+'</div>';
  document.getElementById('kpi-strip').appendChild(d);
});

// Bars
const tt=document.getElementById('tt');
data.kans.forEach(kan=>{
  const total=data.kan_total[kan];
  const row=document.createElement('div');row.className='bar-row';
  const lbl=document.createElement('div');lbl.className='bar-kan';
  lbl.textContent=kan;lbl.title=kan;
  lbl.addEventListener('click',()=>{document.getElementById('fKan').value=kan;updateTable()});
  const track=document.createElement('div');track.className='bar-track';
  track.addEventListener('click',()=>{document.getElementById('fKan').value=kan;updateTable()});
  CLSorder.forEach(c=>{
    const amt=(data.kan_cls[kan]||{})[c.split('/')[0]]||0;
    if(!amt)return;
    const seg=document.createElement('div');seg.className='bar-seg';
    seg.style.cssText='flex:'+amt+';background:'+D[c];
    seg.addEventListener('mouseenter',ev=>{
      tt.innerHTML='<b>'+kan+'</b><br>'+L[c]+'<br>'
        +Math.round(amt).toLocaleString()+'億円 ('+((amt/total*100).toFixed(1))+'%)';
      tt.style.opacity=1;
      tt.style.left=(ev.clientX+14)+'px';tt.style.top=(ev.clientY-60)+'px';
    });
    seg.addEventListener('mousemove',ev=>{
      tt.style.left=(ev.clientX+14)+'px';tt.style.top=(ev.clientY-60)+'px';
    });
    seg.addEventListener('mouseleave',()=>{tt.style.opacity=0});
    track.appendChild(seg);
  });
  const tot=document.createElement('div');tot.className='bar-total';
  tot.textContent=Math.round(total/1000).toLocaleString()+'千億';
  row.appendChild(lbl);row.appendChild(track);row.appendChild(tot);
  document.getElementById('bars').appendChild(row);
});

// Legend
CLSlegend.forEach(c=>{
  const li=document.createElement('div');li.className='leg-item';
  li.innerHTML='<span class="leg-dot" style="background:'+(D[c]||'#ccc')+'"></span>'
    +'<span>'+L[c]+'</span>';
  li.addEventListener('click',()=>{document.getElementById('fCls').value=c;updateTable()});
  document.getElementById('legend').appendChild(li);
});

// Filters
const fKan=document.getElementById('fKan');
const fCls=document.getElementById('fCls');
const fTxt=document.getElementById('fTxt');
data.kans.forEach(k=>{
  const o=document.createElement('option');o.value=k;o.textContent=k;fKan.appendChild(o);
});
CLSorder.forEach(c=>{
  const o=document.createElement('option');o.value=c;o.textContent=L[c];fCls.appendChild(o);
});

let filtered=[],page=0;const PER=50;

function updateTable(){
  const k=fKan.value,c=fCls.value,t=fTxt.value.toLowerCase();
  filtered=data.rows.filter(r=>
    (!k||r.k===k)&&
    (!c||r.c.split('/').includes(c))&&
    (!t||r.m.toLowerCase().includes(t)||r.ko.toLowerCase().includes(t))
  );
  page=0;render();
}

function render(){
  const start=page*PER,end=Math.min(start+PER,filtered.length);
  const tbody=document.getElementById('tbody');tbody.innerHTML='';
  filtered.slice(start,end).forEach(r=>{
    const tr=document.createElement('tr');
    const chips=r.c.split('/').map(c=>{
      const co=D[c]||'#888';
      return '<span class="chip" style="background:'+co+'20;border:1px solid '+co+'50;color:'+co+'">'
        +'<span style="width:6px;height:6px;border-radius:50%;background:'+co+';display:inline-block;flex-shrink:0"></span>'
        +' '+c+'</span>';
    }).join('');
    tr.innerHTML='<td style="color:var(--text-2);white-space:nowrap">'+r.k+'</td>'
      +'<td class="col-ko" style="color:var(--text-3);font-size:.7rem">'+r.ko+'</td>'
      +'<td>'+r.m+'</td>'
      +'<td class="mono">'+Math.round(r.a).toLocaleString()+'</td>'
      +'<td style="white-space:nowrap">'+chips+'</td>'
      +'<td class="mono">'+Math.round(r.s).toLocaleString()+'</td>'
      +'<td class="td-reason col-reason">'+r.r+'</td>';
    tbody.appendChild(tr);
  });
  document.getElementById('pInfo').textContent=(start+1)+'–'+end;
  document.getElementById('pTot').textContent=filtered.length.toLocaleString()+'件';
  document.getElementById('cnt-lbl').textContent=filtered.length.toLocaleString()+'件';
  document.getElementById('pPrev').disabled=page===0;
  document.getElementById('pNext').disabled=end>=filtered.length;
}

document.getElementById('pPrev').addEventListener('click',()=>{page--;render()});
document.getElementById('pNext').addEventListener('click',()=>{page++;render()});
fKan.addEventListener('change',updateTable);
fCls.addEventListener('change',updateTable);
fTxt.addEventListener('input',updateTable);
updateTable();

// Theme toggle
function toggleTheme(){
  const r=document.documentElement;
  const cur=r.getAttribute('data-theme');
  r.setAttribute('data-theme',cur==='dark'?'light':'dark');
}
</script>
</body>
</html>
