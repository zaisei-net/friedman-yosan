<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>歳出分類レビュー</title>
<style>
:root{
  --bg:#fff;--surface:#f8f9fa;--border:#e2e6ea;
  --text:#1a1d21;--text-2:#555;--text-3:#888;
  --accent:#2563eb;--accent-lt:#eff6ff;
  --green:#16a34a;--green-lt:#f0fdf4;
  --amber:#b45309;--amber-lt:#fef9e7;
  --red:#dc2626;--red-lt:#fef2f2;
  --purple:#7c3aed;--purple-lt:#ede9fe;
  --radius:6px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111;--surface:#1c1c1e;--border:#2c2c2e;
  --text:#f0f0f0;--text-2:#bbb;--text-3:#666;
  --accent:#60a5fa;--accent-lt:#1e3a5f;
  --green:#4ade80;--green-lt:#052e16;
  --amber:#fcd34d;--amber-lt:#2a1e00;
  --red:#f87171;--red-lt:#2a0000;
  --purple:#a78bfa;--purple-lt:#1e1b4b;
}}
:root[data-theme="dark"]{
  --bg:#111;--surface:#1c1c1e;--border:#2c2c2e;
  --text:#f0f0f0;--text-2:#bbb;--text-3:#666;
  --accent:#60a5fa;--accent-lt:#1e3a5f;
  --green:#4ade80;--green-lt:#052e16;
  --amber:#fcd34d;--amber-lt:#2a1e00;
  --red:#f87171;--red-lt:#2a0000;
  --purple:#a78bfa;--purple-lt:#1e1b4b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN',sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
button{cursor:pointer;font-family:inherit;font-size:13px;border-radius:var(--radius);
  padding:.35em .9em;border:1px solid var(--border);background:var(--surface);color:var(--text)}
button:hover{opacity:.8}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
input,select,textarea{font-family:inherit;font-size:13px;border:1px solid var(--border);
  border-radius:var(--radius);padding:.3em .6em;background:var(--bg);color:var(--text);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-variant-numeric:tabular-nums}

/* Header */
#hdr{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);
  padding:.45rem 1rem;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
#hdr h1{font-size:.95rem;font-weight:700;white-space:nowrap}
.pbar-wrap{flex:1;min-width:100px;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.pbar{height:100%;background:var(--accent);transition:width .3s}
#prog-lbl{font-size:.7rem;color:var(--text-3);white-space:nowrap}

/* List */
#list-controls{padding:.5rem 1rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;
  border-bottom:1px solid var(--border);background:var(--surface)}
#list-controls select,#list-controls input{width:auto}
#list-tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:.45rem .75rem;font-size:.7rem;font-weight:700;color:var(--text-3);
  border-bottom:2px solid var(--border);white-space:nowrap;background:var(--bg)}
td{padding:.35rem .75rem;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:var(--accent-lt);cursor:pointer}
.sbadge{display:inline-block;padding:.08em .5em;border-radius:3px;font-size:.64rem;font-weight:700}
.st-none{background:var(--border);color:var(--text-3)}
.st-ok{background:var(--green-lt);color:var(--green);border:1px solid var(--green)}
.st-cd{background:var(--amber-lt);color:var(--amber);border:1px solid var(--amber)}
.st-ng{background:var(--red-lt);color:var(--red);border:1px solid var(--red)}
.st-jin{background:var(--purple-lt);color:var(--purple);border:1px solid var(--purple)}
.st-jincand{background:var(--purple-lt);color:var(--purple)}
.st-auto{background:var(--amber-lt);color:var(--amber);border:1px solid var(--amber)}
.st-skip{background:var(--surface);color:var(--text-3);border:1px solid var(--border)}
#list-pager{display:flex;gap:.4rem;align-items:center;padding:.5rem 1rem;
  border-top:1px solid var(--border);font-size:.75rem;color:var(--text-3)}

/* Classify */
#cv{max-width:700px;margin:0 auto;padding:1rem}
.nav-row{display:flex;align-items:center;gap:.4rem;margin-bottom:.8rem;flex-wrap:wrap}
.nav-row .pos{font-size:.78rem;color:var(--text-3);flex:1;text-align:center}

.icard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:.7rem 1rem;margin-bottom:.9rem}
.icard .breadcrumb{font-size:.7rem;color:var(--text-3);margin-bottom:.2rem}
.icard .mname{font-size:1.05rem;font-weight:700}
.icard .amount{font-size:.85rem;color:var(--accent);font-weight:600;margin-top:.2rem}

/* Q blocks — conversational one-sentence style */
.qblock{margin-bottom:.85rem;padding:.7rem .9rem;border-left:3px solid var(--border);
  background:var(--surface);border-radius:0 var(--radius) var(--radius) 0}
.qblock.active{border-left-color:var(--accent)}
.qblock .qlabel{font-size:.68rem;font-weight:800;letter-spacing:.1em;color:var(--text-3);
  text-transform:uppercase;margin-bottom:.3rem}
.qblock .qtext{font-size:.9rem;margin-bottom:.5rem;line-height:1.4}
.btn-row{display:flex;gap:.4rem;flex-wrap:wrap}
.btn-row button{font-size:.82rem}
.btn-row button.sel{border-color:var(--accent);background:var(--accent-lt);color:var(--accent);font-weight:700}
.btn-row button.sel-ok{border-color:var(--green);background:var(--green-lt);color:var(--green);font-weight:700}
.btn-row button.sel-ng{border-color:var(--red);background:var(--red-lt);color:var(--red);font-weight:700}
.btn-row button.sel-cd{border-color:var(--amber);background:var(--amber-lt);color:var(--amber);font-weight:700}

/* Function rows (Q3) — vertical list */
.frow{
  display:flex;align-items:flex-start;gap:.55rem;
  padding:.4rem .5rem;border-radius:var(--radius);cursor:pointer;
  margin-bottom:.15rem;border:1px solid transparent;
  transition:background .1s;user-select:none;
}
.frow:hover{background:var(--border);border-color:var(--border)}
.frow.is-full{background:var(--accent-lt);border-color:var(--accent)}
.frow.is-partial{background:var(--amber-lt);border-color:var(--amber)}
.fnum{
  flex-shrink:0;width:1.9em;height:1.9em;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.85rem;
  border:2px solid var(--border);background:var(--bg);color:var(--text);
  margin-top:.05em;
}
.frow.is-full .fnum{border-color:var(--accent);background:var(--accent);color:#fff}
.frow.is-partial .fnum{border-color:var(--amber);background:var(--amber-lt);color:var(--amber)}
.fname{flex:1;font-size:.82rem;line-height:1.45;padding-top:.05em}
.fstate{flex-shrink:0;font-size:.68rem;font-weight:700;padding:.1em .45em;
  border-radius:3px;white-space:nowrap;align-self:center;
  color:var(--text-3);background:var(--border)}
.frow.is-full .fstate{color:var(--accent);background:var(--accent-lt)}
.frow.is-partial .fstate{color:var(--amber);background:var(--amber-lt)}
.fpct{display:none;align-items:center;gap:.25rem;margin-top:.2rem;font-size:.75rem}
.frow.is-partial .fpct{display:flex}
.fpct input{width:52px;text-align:right;font-size:.82rem}

/* Ratio / verdict */
.ratio-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.3rem 0}
.ratio-row label{font-size:.82rem;font-weight:700;white-space:nowrap}
.ratio-row input{width:64px;text-align:right;font-size:1rem;font-weight:700}
.ratio-row .preview{font-size:.82rem;color:var(--text-2)}
.verdict-pill{display:inline-block;padding:.15em .65em;border-radius:50px;font-weight:700;font-size:.82rem;margin-top:.25rem}
.vp-ok{background:var(--green-lt);color:var(--green)}
.vp-cd{background:var(--amber-lt);color:var(--amber)}
.vp-ng{background:var(--red-lt);color:var(--red)}
.bunrui-lbl{font-size:.72rem;color:var(--text-3);margin-top:.2rem}

/* Action */
.action-row{display:flex;gap:.4rem;justify-content:flex-end;margin-top:.8rem;
  padding-top:.7rem;border-top:1px solid var(--border)}

/* Jin panel */
.jin-box{padding:.6rem .8rem;border-radius:var(--radius);margin-bottom:.8rem;
  background:var(--purple-lt);border:1px solid var(--purple);font-size:.82rem;color:var(--purple)}
</style>
</head>
<body>

<div id="hdr">
  <h1>📊 歳出分類レビュー</h1>
  <div class="pbar-wrap"><div class="pbar" id="prog-bar" style="width:0%"></div></div>
  <span id="prog-lbl">0 / 3,409</span>
  <button onclick="exportCSV()">CSV出力</button>
  <button onclick="document.documentElement.setAttribute('data-theme',document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')">🌓</button>
</div>

<!-- List view -->
<div id="view-list">
  <div id="list-controls">
    <select id="fKan"><option value="">所管：全て</option></select>
    <select id="fStatus">
      <option value="">状態：全て</option>
      <option value="auto">要確認（比率未入力）</option>
      <option value="classified">確認済</option>
      <option value="jinkenhi">人件費</option>
      <option value="unclassified">未分類</option>
      <option value="jinkenhi-candidate">人件費候補</option>
      <option value="skipped">スキップ</option>
    </select>
    <input type="text" id="fTxt" placeholder="科目名で検索…" style="width:180px">
    <button class="primary" onclick="startFromFirst()">▶ 要確認から開始</button>
  </div>
  <div id="list-tbl-wrap">
    <table>
      <thead><tr>
        <th>所管</th><th>項名</th><th>目名</th>
        <th style="text-align:right">元額(億円)</th>
        <th>状態</th><th>判定</th><th style="text-align:right">残す額(億円)</th>
      </tr></thead>
      <tbody id="list-tbody"></tbody>
    </table>
  </div>
  <div id="list-pager">
    <button id="pPrev">‹</button>
    <span id="pInfo"></span>
    <button id="pNext">›</button>
    <span style="margin-left:.4rem" id="pTot"></span>
  </div>
</div>

<!-- Classify view -->
<div id="view-classify" hidden>
<div id="cv">
  <div class="nav-row">
    <button onclick="showList()">← 一覧</button>
    <button onclick="goPrev()">‹</button>
    <span class="pos" id="nav-pos"></span>
    <button onclick="goNext()">›</button>
    <button onclick="skipItem()">スキップ</button>
  </div>

  <!-- Item -->
  <div class="icard" id="item-card"></div>

  <!-- 自動判定バナー -->
  <div id="auto-banner" hidden style="padding:.45rem .75rem;border-radius:var(--radius);margin-bottom:.7rem;
    background:var(--amber-lt);border:1px solid var(--amber);color:var(--amber);font-size:.8rem">
    🤖 自動判定済 — 分類を確認し、正当化比率を入力して保存してください
  </div>

  <!-- 人件費 toggle -->
  <label style="display:flex;align-items:center;gap:.4rem;font-size:.82rem;margin-bottom:.8rem;cursor:pointer">
    <input type="checkbox" id="chk-jin" onchange="onJinChange()" style="width:auto;accent-color:var(--purple)">
    人件費として扱う（省庁の他の歳出の構成比で按分）
  </label>

  <!-- 人件費 panel -->
  <div id="jin-panel" hidden>
    <div class="jin-box" id="jin-result-box">—</div>
    <div class="qblock active">
      <div class="qlabel">メモ</div>
      <textarea id="jin-note" rows="2" placeholder="役職・FTEの内訳など"></textarea>
    </div>
    <div class="action-row">
      <button class="primary" onclick="saveJin()">保存して次へ →</button>
    </div>
  </div>

  <!-- Flowchart -->
  <div id="flow-panel">

    <!-- Q1 -->
    <div class="qblock active" id="q1-block">
      <div class="qlabel">Q1</div>
      <div class="qtext">市場・自発的交換では達成できないか？</div>
      <div class="btn-row">
        <button id="q1-yes" onclick="setQ1('yes')">はい（政府介入が必要）</button>
        <button id="q1-no"  onclick="setQ1('no')">いいえ（市場で達成可能→削除対象）</button>
      </div>
    </div>

    <!-- Q2 -->
    <div class="qblock" id="q2-block" hidden>
      <div class="qlabel">Q2</div>
      <div class="qtext">根拠となる市場の失敗は何か？（複数可）</div>
      <div class="btn-row" id="q2-btns">
        <button id="q2-A" onclick="toggleQ2('A')">A 公共財</button>
        <button id="q2-B" onclick="toggleQ2('B')">B 技術的独占</button>
        <button id="q2-C" onclick="toggleQ2('C')">C 外部性<small style="font-size:.68em;opacity:.7">（同著では「近隣効果」）</small></button>
        <button id="q2-D" onclick="toggleQ2('D')">D 温情主義</button>
      </div>
    </div>

    <!-- Q3 -->
    <div class="qblock" id="q3-block" hidden>
      <div class="qlabel">Q3</div>
      <div class="qtext">該当するフリードマン機能を選んでください。<small style="color:var(--text-3)">（1回=完全、2回=一部、3回=解除）</small></div>
      <div id="func-list"></div>
    </div>

    <!-- Q4 -->
    <div class="qblock" id="q4-block" hidden>
      <div class="qlabel">Q4</div>
      <div class="qtext">この目の総歳出のうち、政府が正当に担うべき割合は何%か？</div>
      <div class="ratio-row">
        <label>正当化比率</label>
        <input type="number" id="ratio-in" min="0" max="100" step="1" oninput="onRatio()" placeholder="0–100">
        <span>%</span>
        <span class="preview" id="ratio-preview"></span>
      </div>
      <div id="verdict-box"></div>
      <div class="bunrui-lbl" id="bunrui-lbl"></div>
      <div style="margin-top:.5rem">
        <textarea id="note-in" rows="2" placeholder="根拠メモ（事業内訳・FTE根拠など）"></textarea>
      </div>
    </div>

    <!-- Q1=No panel -->
    <div class="qblock" id="no-block" hidden>
      <div class="verdict-pill vp-ng">❌ 正当化不可（残す額 = 0）</div>
      <div style="margin-top:.5rem">
        <textarea id="no-note" rows="2" placeholder="根拠メモ"></textarea>
      </div>
    </div>

    <div class="action-row">
      <button class="primary" id="save-btn" onclick="saveFlow()" disabled>保存して次へ →</button>
    </div>
  </div>
</div>
</div>

const FUNC_TO_Q2 = {
  '①':'A','②':'A','③':'A','④':'A','⑤':'A','⑥':'A','⑦':'A',
  '⑧':'B','⑨':'C','⑩':'D'
};

// 既存分類文字列を解析
function parseBunrui(c, q2str){
  if(!c||c==='該当なし'||c==='-')return{q1:'no',q2:[],funcs:[]};
  const parts=c.split('/').map(p=>p.trim()).filter(Boolean);
  const funcs=[];
  for(const p of parts){
    const partial=p.startsWith('一部');
    const n=partial?p.slice(2).trim():p;
    if(n)funcs.push({n,s:partial?2:1,pct:null});
  }
  let q2=[];
  if(q2str&&q2str!=='-'){
    q2=q2str.split('/').map(s=>s[0]).filter(k=>'ABCD'.includes(k));
  }
  if(!q2.length){
    const s=new Set();funcs.forEach(f=>{if(FUNC_TO_Q2[f.n])s.add(FUNC_TO_Q2[f.n]);});q2=[...s];
  }
  return{q1:'yes',q2,funcs};
}

// 評価式: BASE×完全性係数 (理論値/2保守値)
// A=50%(公共財) D=35%(温情主義) B=33%(技術的独占) C=18%(外部性)
// 完全性係数: 全完全→1.0, いずれか一部→0.4
// ※温情主義(D)の対象人口比は自動算出不可 — 対象が責任能力者混在の場合は手動補正
const Q2_BASE={A:50,D:35,B:33,C:18};

const HOJO_RATE_MAP=[

  ['全国健康保険協会保険給付費等補助金',0.164],
  // 私立学校 (国30%+都道府県補助≈5% → 総公費≈35%)
  ['私立大学等経常費補助金',0.35],
  ['私立高等学校等経常費助成費補助金',0.35],
  ['私立学校施設整備費補助金',0.35],
  // ※生活保護・障害者自立支援・難病・義務教育は総公費率≈100%なので補正なし
];
function getHojoRate(m){
  for(const[pat,rate] of HOJO_RATE_MAP){if(m.includes(pat))return rate;}
  return null; // 不明: 直営扱い(補正なし)
}

function calcAutoRatio(q2arr,funcs,m=''){
  if(!q2arr||!q2arr.length)return 0;
  const base=Math.max(...q2arr.map(k=>Q2_BASE[k]||0));
  const hasPartial=funcs&&funcs.some(f=>f.s===2);
  const baseRatio=base*(hasPartial?0.4:1.0);
  const hr=getHojoRate(m);
  return hr!==null&&hr<1?Math.min(Math.round(baseRatio/hr),100):Math.round(baseRatio);
}

// 初回ロード時に全件自動判定
function initAutoClassify(){
  let anyNew=false;
  ITEMS.forEach(it=>{
    if(isAutoJin(it))return;   // 人件費は別フローで確認
    if(getRec(it))return;       // 既に分類済みはスキップ
    const{q1,q2,funcs}=parseBunrui(it.c,it.q2);
    const verdict=it.v||'';
    let ratio,sAmt;
    if(q1==='no'){ratio=0;sAmt=0;}
    else{ratio=calcAutoRatio(q2,funcs,it.m);sAmt=it.a*ratio/100;}
    store[ikey(it)]={status:'classified',q1,q2,funcs,ratio,bunrui:it.c||'該当なし',verdict,sAmt,note:'',savedAt:null,auto:true};
    anyNew=true;
  });
  if(anyNew)saveStore();
}

  '④':'③のルールの解釈をめぐる意見の対立を裁定すること',
  '⑤':'契約の履行を強制すること',
  '⑥':'競争を促進すること',
  '⑦':'貨幣制度の枠組を用意すること',
  '⑧':'技術的独占に対抗するための活動に従事すること',
  '⑨':'政府の干渉を正当化するに足るほど重大であると一般に考えられる外部性を克服するための活動に従事すること',
  '⑩':'狂人、子供等の責任能力のない者を保護するために私的な慈善運動や個人の家庭の対象とならない場合、これを補足すること',
};
const Q2_FUNCS = {A:['①','②','③','④','⑤','⑥','⑦'],B:['⑧'],C:['⑨'],D:['⑩']};
const NUMS_A = new Set(['①','②','③','④','⑤','⑥','⑦']);

function loadStore(){
  try{store=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');}catch(e){store={};}
  initAutoClassify();  // 未分類を自動判定で埋める（初回のみ有効）
}
function saveStore(){localStorage.setItem(STORE_KEY,JSON.stringify(store));}
function ikey(it){return it.k+'||'+it.ko+'||'+it.m;}
function getRec(it){return store[ikey(it)]||null;}
function setRec(it,rec){store[ikey(it)]=rec;saveStore();updateProg();}

function updateProg(){
  const confirmed=ITEMS.filter(it=>{const r=getRec(it);return r&&r.status!=='skipped'&&r.status!=='auto';}).length;
  const needsRatio=ITEMS.filter(it=>{const r=getRec(it);return r&&r.status==='auto';}).length;
  const pct=Math.round(confirmed/ITEMS.length*100);
  document.getElementById('prog-bar').style.width=pct+'%';
  let lbl=confirmed.toLocaleString()+' / '+ITEMS.length.toLocaleString();
  if(needsRatio)lbl+='（要確認 '+needsRatio.toLocaleString()+'件）';
  document.getElementById('prog-lbl').textContent=lbl;
}

// ── List ──
let lPage=0,L_PER=50,lFiltered=[];
function showList(){
  document.getElementById('view-list').hidden=false;
  document.getElementById('view-classify').hidden=true;
  renderList();
}
function renderList(){
  const fKan=document.getElementById('fKan');
  if(fKan.options.length<2)KANS.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;fKan.appendChild(o);});
  const kan=fKan.value,st=document.getElementById('fStatus').value,
        txt=document.getElementById('fTxt').value.toLowerCase();
  lFiltered=ITEMS.filter(it=>{
    if(kan&&it.k!==kan)return false;
    if(txt&&!it.m.toLowerCase().includes(txt)&&!it.ko.toLowerCase().includes(txt))return false;
    if(st){
      const r=getRec(it);
      const rstatus=r?r.status:'unclassified';
      if(st==='jinkenhi-candidate'){
        if(rstatus!=='unclassified'||!isAutoJin(it))return false;
      } else if(st==='unclassified'){
        if(rstatus!=='unclassified')return false;
      } else {
        if(rstatus!==st)return false;
      }
    }
    return true;
  });
  const s=lPage*L_PER,e=Math.min(s+L_PER,lFiltered.length);
  const tb=document.getElementById('list-tbody');tb.innerHTML='';
  lFiltered.slice(s,e).forEach(it=>{
    const r=getRec(it),st2=r?r.status:'unclassified';
    let sb='',vb='',sa='—';
    if(st2==='unclassified'){
      if(isAutoJin(it)){sb='<span class="sbadge st-jincand">人件費候補</span>';}
      else{sb='<span class="sbadge st-none">未分類</span>';}
    }
    else if(st2==='auto'){
      const vc=r.verdict||'';
      const vcls=vc.startsWith('⚠️')?'st-cd':'st-none';
      sb='<span class="sbadge st-auto">要確認</span>';
      vb='<span class="sbadge '+vcls+'">'+(vc?vc.slice(0,2):'?')+'</span>';
      sa='—';
    }
    else if(st2==='jinkenhi'){
      sb='<span class="sbadge st-jin">人件費</span>';vb='<span class="sbadge st-cd">⚠️</span>';
      const jr=jinRatio(it);sa=jr!==null?Math.round(it.a*jr/100).toLocaleString():'(按分待)';
    } else if(st2==='classified'){
      const vc=r.verdict;
      const cls=vc.startsWith('✅')?'st-ok':vc.startsWith('⚠️')?'st-cd':'st-ng';
      sb='<span class="sbadge '+cls+'">分類済</span>';
      vb='<span class="sbadge '+cls+'">'+vc.slice(0,2)+'</span>';
      sa=Math.round(r.sAmt).toLocaleString();
    } else {sb='<span class="sbadge st-skip">スキップ</span>';}
    const idx=ITEMS.indexOf(it);
    const tr=document.createElement('tr');
    tr.onclick=()=>showClassify(idx);
    tr.innerHTML='<td style="white-space:nowrap;font-size:.75rem">'+it.k+'</td>'
      +'<td style="font-size:.72rem;color:var(--text-3)">'+it.ko+'</td>'
      +'<td>'+it.m+'</td>'
      +'<td class="mono" style="text-align:right">'+Math.round(it.a).toLocaleString()+'</td>'
      +'<td>'+sb+'</td><td>'+vb+'</td>'
      +'<td class="mono" style="text-align:right">'+sa+'</td>';
    tb.appendChild(tr);
  });
  document.getElementById('pInfo').textContent=(s+1)+'–'+e;
  document.getElementById('pTot').textContent=lFiltered.length.toLocaleString()+'件';
  document.getElementById('pPrev').disabled=lPage===0;
  document.getElementById('pNext').disabled=e>=lFiltered.length;
}
document.getElementById('pPrev').addEventListener('click',()=>{lPage--;renderList();});
document.getElementById('pNext').addEventListener('click',()=>{lPage++;renderList();});
['fKan','fStatus'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{lPage=0;renderList();}));
document.getElementById('fTxt').addEventListener('input',()=>{lPage=0;renderList();});
function startFromFirst(){
  // 要確認（auto）を優先、次に未分類
  let idx=ITEMS.findIndex(it=>{const r=getRec(it);return r&&r.status==='auto';});
  if(idx<0)idx=ITEMS.findIndex(it=>{const r=getRec(it);return !r||r.status==='skipped';});
  if(idx<0){alert('全件確認済みです！');return;}
  showClassify(idx);
}

// 特定制度に連動する人件費項目の定義
// { 目名キーワード: { label, linkedKeywords(AND条件で連動元を特定) } }
const JIN_LINKED = {
  '児童手当': {
    label: '児童手当制度',
    linkedKeywords: ['児童手当', '繰入']
  }
};

// 連動元の分類比率を返す（連動なし→null, 連動先未分類→{ratio:null,pending:true}）
function jinLinkedRatio(it){
  for(const[kw,def] of Object.entries(JIN_LINKED)){
    if(it.m.includes(kw)){
      const linked=ITEMS.find(x=>def.linkedKeywords.every(lk=>x.m.includes(lk)));
      if(!linked)return{ratio:null,label:def.label,pending:true,linkedName:'(連動元不明)'};
      const r=getRec(linked);
      if(r&&r.status==='classified'&&r.ratio!=null){
        return{ratio:r.ratio,label:def.label,pending:false,linkedName:linked.m};
      }
      return{ratio:null,label:def.label,pending:true,linkedName:linked.m};
    }
  }
  return null;
}

// ── 人件費按分 ──
function jinRatio(it){
  const linked=jinLinkedRatio(it);
  if(linked!==null)return linked.ratio;
  const cl=ITEMS.filter(x=>x.k===it.k&&getRec(x)&&getRec(x).status==='classified');
  if(!cl.length)return null;
  const tA=cl.reduce((s,x)=>s+x.a,0),tS=cl.reduce((s,x)=>s+getRec(x).sAmt,0);
  return tA>0?tS/tA*100:0;
}

// ── Classify ──
let cIdx=0;
// State
let q1Val=null,q2Sel=new Set(),funcState={};// funcState[num]=0|1|2

function showClassify(idx){
  cIdx=idx;
  document.getElementById('view-list').hidden=true;
  document.getElementById('view-classify').hidden=false;
  renderClassify();
}
function goPrev(){if(cIdx>0){cIdx--;renderClassify();}}
function goNext(){if(cIdx<ITEMS.length-1){cIdx++;renderClassify();}}
function skipItem(){setRec(ITEMS[cIdx],{status:'skipped'});goNext();renderClassify();}

function renderClassify(){
  const it=ITEMS[cIdx];
  const r=getRec(it);
  document.getElementById('nav-pos').textContent=(cIdx+1)+' / '+ITEMS.length;
  document.getElementById('item-card').innerHTML=
    '<div class="breadcrumb">'+it.k+' › '+it.ko+'</div>'
    +'<div class="mname">'+it.m+'</div>'
    +'<div class="amount mono">元額 '+Math.round(it.a).toLocaleString()+' 億円</div>';

  const autoJin=!r&&isAutoJin(it);
  const isJin=(r&&r.status==='jinkenhi')||autoJin;
  document.getElementById('chk-jin').checked=isJin;
  document.getElementById('jin-panel').hidden=!isJin;
  document.getElementById('flow-panel').hidden=isJin;
  const isAutoRec=r&&r.status==='auto';
  document.getElementById('auto-banner').hidden=!isAutoRec;
  if(isJin){renderJin(it,autoJin);return;}

  // Reset state
  q1Val=null;q2Sel=new Set();funcState={};
  // Hide all blocks except Q1
  ['q2-block','q3-block','q4-block','no-block'].forEach(id=>document.getElementById(id).hidden=true);
  document.getElementById('q1-block').hidden=false;
  ['q1-yes','q1-no'].forEach(id=>document.getElementById(id).classList.remove('sel','sel-ng','sel-ok'));
  ['A','B','C','D'].forEach(k=>{const b=document.getElementById('q2-'+k);if(b)b.classList.remove('sel');});
  document.getElementById('func-list').innerHTML='';
  document.getElementById('ratio-in').value='';
  document.getElementById('note-in').value='';
  document.getElementById('no-note').value='';
  document.getElementById('verdict-box').innerHTML='';
  document.getElementById('bunrui-lbl').textContent='';
  document.getElementById('save-btn').disabled=true;

  // Restore (auto items pre-fill Q1-Q3, leave ratio blank for confirmation)
  if(r&&(r.status==='classified'||r.status==='auto'))restoreFlow(r);
}

function renderJin(it,autoDetected){
  const ratio=jinRatio(it);
  const linked=jinLinkedRatio(it);
  const box=document.getElementById('jin-result-box');
  let html='';
  if(autoDetected){
    html+='<div style="font-weight:700;margin-bottom:.35rem">🤖 自動検出: 目名に「'+matchedJinKeyword(it)+'」が含まれるため人件費と判定しました</div>';
  }
  if(linked!==null){
    // 制度連動
    if(linked.pending){
      html+='<b>🔗 '+linked.label+'に連動</b>（連動元「'+linked.linkedName+'」が未分類のため比率未確定）';
    } else {
      html+='<b>🔗 '+linked.label+'に連動</b>: '+linked.ratio.toFixed(1)+'%'
        +'（残す額: '+Math.round(it.a*linked.ratio/100).toLocaleString()+'億円）'
        +'<div style="font-size:.72rem;opacity:.7;margin-top:.2rem">連動元: '+linked.linkedName+'</div>';
    }
  } else {
    html+=(ratio===null
      ?'省庁の他の歳出が未分類のため按分比率未確定'
      :'現時点の省庁按分比率: '+ratio.toFixed(1)+'%（残す額: '+Math.round(it.a*ratio/100).toLocaleString()+'億円）');
  }
  box.innerHTML=html;
  const rec=getRec(it);
  document.getElementById('jin-note').value=rec&&rec.note?rec.note:'';
}
function onJinChange(){
  const on=document.getElementById('chk-jin').checked;
  document.getElementById('jin-panel').hidden=!on;
  document.getElementById('flow-panel').hidden=on;
  if(on)renderJin(ITEMS[cIdx],false);
  else{
    // チェックを外した = 自動検出を却下してフローチャートへ
    q1Val=null;q2Sel=new Set();funcState={};
    ['q2-block','q3-block','q4-block','no-block'].forEach(id=>document.getElementById(id).hidden=true);
    document.getElementById('q1-block').hidden=false;
    ['q1-yes','q1-no'].forEach(id=>document.getElementById(id).classList.remove('sel','sel-ng','sel-ok'));
    ['A','B','C','D'].forEach(k=>{const b=document.getElementById('q2-'+k);if(b)b.classList.remove('sel');});
    document.getElementById('func-list').innerHTML='';
    document.getElementById('ratio-in').value='';
    document.getElementById('note-in').value='';
    document.getElementById('no-note').value='';
    document.getElementById('verdict-box').innerHTML='';
    document.getElementById('bunrui-lbl').textContent='';
    document.getElementById('save-btn').disabled=true;
  }
}
function saveJin(){
  setRec(ITEMS[cIdx],{status:'jinkenhi',note:document.getElementById('jin-note').value,savedAt:new Date().toISOString()});
  nextUnclassified();renderClassify();
}

// Q1
function setQ1(v){
  q1Val=v;
  document.getElementById('q1-yes').className=v==='yes'?'sel-ok':'';
  document.getElementById('q1-no').className=v==='no'?'sel-ng':'';
  document.getElementById('q2-block').hidden=(v==='no');
  document.getElementById('no-block').hidden=(v==='yes');
  document.getElementById('q3-block').hidden=true;
  document.getElementById('q4-block').hidden=true;
  if(v==='no'){document.getElementById('ratio-in').value='0';document.getElementById('save-btn').disabled=false;}
  else document.getElementById('save-btn').disabled=true;
}

// Q2
function toggleQ2(k){
  if(q2Sel.has(k))q2Sel.delete(k);else q2Sel.add(k);
  ['A','B','C','D'].forEach(x=>document.getElementById('q2-'+x).className=q2Sel.has(x)?'sel':'');
  rebuildChips();
  document.getElementById('q3-block').hidden=q2Sel.size===0;
  document.getElementById('q4-block').hidden=q2Sel.size===0;
  document.getElementById('save-btn').disabled=!canSave();
}

function rebuildChips(){
  const visible=[];
  ['A','B','C','D'].forEach(k=>{if(q2Sel.has(k))Q2_FUNCS[k].forEach(n=>visible.push(n));});
  Object.keys(funcState).forEach(n=>{if(!visible.includes(n))delete funcState[n];});
  const fl=document.getElementById('func-list');fl.innerHTML='';
  visible.forEach(n=>{
    const s=funcState[n]||0;
    const pctVal=document.getElementById('pp_'+n)?document.getElementById('pp_'+n).value:'';
    const row=document.createElement('div');
    row.className='frow'+(s===1?' is-full':s===2?' is-partial':'');
    row.innerHTML=
      '<span class="fnum">'+n+'</span>'
      +'<span class="fname">'+FNAMES[n]+'</span>'
      +'<span class="fstate">'+(s===0?'—':s===1?'完全':'一部')+'</span>';
    // 一部の%input
    const pDiv=document.createElement('div');
    pDiv.style.cssText='display:'+(s===2?'flex':'none')+';align-items:center;gap:.25rem;margin-top:.15rem;font-size:.75rem;flex-wrap:nowrap';
    pDiv.innerHTML='正当化率 <input type="number" id="pp_'+n+'" min="1" max="99" step="1" value="'+pctVal+'" placeholder="%" oninput="onRatio()" style="width:52px;text-align:right"> %';
    row.appendChild(pDiv);
    row.onclick=(e)=>{
      if(e.target.tagName==='INPUT')return;
      funcState[n]=((funcState[n]||0)+1)%3;
      rebuildChips();autoRatio();onRatio();
    };
    fl.appendChild(row);
  });
}
function autoRatio(){
  const funcs=getSelFuncs();
  if(!funcs.length)return;
  const q2=[...new Set(funcs.map(f=>FUNC_TO_Q2[f.n]).filter(Boolean))];
  const m=ITEMS[cIdx]?ITEMS[cIdx].m:'';
  document.getElementById('ratio-in').value=calcAutoRatio(q2,funcs,m);
}

function getSelFuncs(){
  return Object.entries(funcState).filter(([,s])=>s>0).map(([n,s])=>{
    const pEl=document.getElementById('pp_'+n);
    return{n,s,pct:pEl?parseFloat(pEl.value)||null:null};
  });
}
function getBunrui(){
  return getSelFuncs().map(f=>(f.s===2?'一部':'')+f.n).join('/');
}
function getVerdict(){
  if(q1Val==='no')return'❌正当化不可';
  const funcs=getSelFuncs();
  if(!funcs.length)return null;
  if(funcs.some(f=>f.s===2||!NUMS_A.has(f.n)))return'⚠️条件付き';
  return'✅正当化可';
}
function onRatio(){
  const it=ITEMS[cIdx];
  const ratio=parseFloat(document.getElementById('ratio-in').value);
  const v=getVerdict();
  const amt=isNaN(ratio)?'—':Math.round(it.a*ratio/100).toLocaleString();
  document.getElementById('ratio-preview').textContent='→ '+amt+' 億円';
  const vb=document.getElementById('verdict-box');
  if(v){const cls=v.startsWith('✅')?'vp-ok':v.startsWith('⚠️')?'vp-cd':'vp-ng';
    vb.innerHTML='<div class="verdict-pill '+cls+'">'+v+'</div>';}
  const b=getBunrui();
  document.getElementById('bunrui-lbl').textContent=b?'分類: '+b:'';
  document.getElementById('save-btn').disabled=!canSave();
}
function canSave(){
  if(!q1Val)return false;
  if(q1Val==='no')return true;
  if(!q2Sel.size)return false;
  const funcs=getSelFuncs();if(!funcs.length)return false;
  const r=parseFloat(document.getElementById('ratio-in').value);
  return !isNaN(r)&&r>=0&&r<=100;
}
function saveFlow(){
  const it=ITEMS[cIdx];
  let ratio=0,bunrui='該当なし',verdict='❌正当化不可',note='';
  if(q1Val==='yes'){
    const funcs=getSelFuncs();
    ratio=parseFloat(document.getElementById('ratio-in').value)||0;
    bunrui=getBunrui()||'該当なし';
    verdict=getVerdict()||'❌正当化不可';
    note=document.getElementById('note-in').value;
  } else {
    note=document.getElementById('no-note').value;
  }
  setRec(it,{status:'classified',q1:q1Val,
    q2:[...q2Sel],funcs:getSelFuncs(),ratio,bunrui,verdict,
    sAmt:it.a*ratio/100,note,savedAt:new Date().toISOString()});
  nextUnclassified();renderClassify();
}
function nextUnclassified(){
  // autoを優先的に次の対象とする
  let nx=cIdx+1;
  while(nx<ITEMS.length){
    const r=getRec(ITEMS[nx]);
    if(!r||r.status==='auto'||r.status==='skipped')break;
    nx++;
  }
  cIdx=nx<ITEMS.length?nx:Math.min(cIdx+1,ITEMS.length-1);
}
function restoreFlow(r){
  if(r.q1)setQ1(r.q1);
  if(r.q2){r.q2.forEach(k=>{q2Sel.add(k);document.getElementById('q2-'+k).className='sel';});
    rebuildChips();
    document.getElementById('q3-block').hidden=false;
    document.getElementById('q4-block').hidden=false;}
  if(r.funcs){r.funcs.forEach(f=>{funcState[f.n]=f.s;});rebuildChips();
    r.funcs.filter(f=>f.s===2).forEach(f=>{const el=document.getElementById('pp_'+f.n);if(el&&f.pct)el.value=f.pct;});}
  document.getElementById('ratio-in').value=r.ratio!=null?r.ratio:'';
  document.getElementById('note-in').value=r.note||'';
  onRatio();
}

// Export
function exportCSV(){
  const rows=[['所管','項名','目名','元額(億円)','状態','分類','判定','残す額(億円)','正当化率(%)','メモ','保存日時']];
  ITEMS.forEach(it=>{
    const r=getRec(it);
    if(!r){rows.push([it.k,it.ko,it.m,it.a,'未分類','','','','','','']);return;}
    if(r.status==='jinkenhi'){const jr=jinRatio(it);rows.push([it.k,it.ko,it.m,it.a,'人件費','(按分)','⚠️条件付き',jr!==null?Math.round(it.a*jr/100):'',jr?jr.toFixed(1):'',r.note||'',r.savedAt||'']);return;}
    if(r.status==='skipped'){rows.push([it.k,it.ko,it.m,it.a,'スキップ','','','','','','']);return;}
    rows.push([it.k,it.ko,it.m,it.a,'分類済',r.bunrui||'',r.verdict||'',Math.round(r.sAmt||0),r.ratio||0,r.note||'',r.savedAt||'']);
  });
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='classify_review_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}

loadStore();showList();updateProg();
